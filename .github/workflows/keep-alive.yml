name: Keep Render Backend Awake

on:
  schedule:
    # Runs every 10 minutes (cron expression)
    - cron: "*/10 * * * *"
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          # The ping targets the public books endpoint. 
          # Modify the URL below to match your actual Render backend URL.
          URL="https://smiling-books-backend.onrender.com"
          echo "Pinging backend at $URL/api/books..."
          curl -s -f "$URL/api/books" > /dev/null || echo "Ping failed or backend returned non-200 code."
